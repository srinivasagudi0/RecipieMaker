
<html>
    <head>
        <title>Pantry</title>
        <link rel="stylesheet" href="pantry.css">
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <main>
            <h1 class="title">My Pantry</h1>
            <p class="caption">Add ingredients you already have at home.</p>

            <input id="ingredient-input" type="text"
                placeholder="Enter an ingredient...">
            <button id="add-btn">Add Ingredient</button>
            <button id="clear-btn">Clear All</button>

            <h2>My Ingredients</h2>
            <p id="warn-ing-no">Atleast 4 ingredients needed.</p>
            <ul id="ingredient-list">
            </ul>
            <button id="make-btn">Make My Dish</button>
        </main>
        <script src="pantry.js"></script>
    </body>
    
</html>
